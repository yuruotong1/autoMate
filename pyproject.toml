[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automate-hub"
version = "4.6.0"
description = "A smart NAS for AI: notes, files, reminders, memory, and 30+ tools. Plug into any LLM via MCP / HTTP / bridge."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["agent", "mcp", "automation", "llm", "claude", "openai", "kimi", "qwen", "rpa"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Intended Audience :: Developers",
]

# Minimal dependencies — server + storage + crypto. Everything else is opt-in.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "cryptography>=41.0",
    "python-multipart>=0.0.9",
    "pywebpush>=2.0",
    # v4.5.7: MCP is now the primary integration path (OpenClaw / Claude
    # Desktop / Cursor / Cline call autoMate as a tool source over MCP).
    # Promoted from optional to required so the /mcp endpoint always
    # works without an extras-install dance.
    # Pin <2: mcp 2.x renamed FastMCP to MCPServer and moved APIs; the
    # bridge (automate/server/mcp_bridge.py) targets the 1.x FastMCP API.
    # Without the upper bound a fresh install gets mcp 2.x and the /mcp
    # mount silently disappears.
    "mcp[cli]>=1.0.0,<2",
]

[project.optional-dependencies]
# LiteLLM AI gateway (100+ providers via unified interface)
litellm = ["litellm>=1.65,<1.85"]
# Browser execution (Playwright). After install: `python -m playwright install chromium`
browser = ["playwright>=1.40"]
# Desktop execution (screenshot / mouse / keyboard). Skip on headless servers.
desktop = ["pyautogui>=0.9.54", "pillow>=10.0"]
# Reverse-tunnel client (`automate relay`) for using the hub from anywhere.
relay = ["websockets>=12.0", "httpx>=0.27"]
# Everything
full = [
    "automate-hub[mcp]",
    "automate-hub[browser]",
    "automate-hub[desktop]",
    "automate-hub[relay]",
]

[project.scripts]
# Primary entry: starts the BS hub and opens the browser UI.
automate = "automate.cli:main"
# Stdio MCP entry — for upstream LLM clients to mount autoMate as a tool server.
automate-mcp = "automate.cli:main"

[project.urls]
Homepage   = "https://github.com/yuruotong1/autoMate"
Repository = "https://github.com/yuruotong1/autoMate"
Issues     = "https://github.com/yuruotong1/autoMate/issues"

[tool.setuptools.packages.find]
include = ["automate*"]

[tool.setuptools.package-data]
"automate" = ["frontend/*", "frontend/**/*"]
